[project]
name = "sdrsm"
version = "1.0.0"
description = "Student Digital Risk Assessment (SDRSM) Flask API"
requires-python = ">=3.12"
dependencies = [
    "Flask>=3.0,<4.0",
    "Flask-SQLAlchemy>=3.1,<4.0",
    "SQLAlchemy>=2.0.36",
    "PyJWT>=2.8,<3.0",
    "python-dotenv>=1.0",
    "PyMySQL[rsa]>=1.1",
    "google-auth>=2.35,<3.0",
    "requests>=2.31",
    "psycopg2-binary>=2.9",
]

[tool.vercel]
entrypoint = "backend.run:app"
