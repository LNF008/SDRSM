<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Khuyến nghị bảo mật SDRSM — ưu tiên theo mức độ rủi ro và trụ cột." />
  <meta name="theme-color" content="#f3f5fb" />
  <title>Khuyến nghị bảo mật · SDRSM</title>

  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { corePlugins: { preflight: false } };
  </script>

  <link rel="stylesheet" href="../css/style.css?v=20261124" />
  <link rel="stylesheet" href="../css/dashboard.css?v=20261124" />
  <link rel="stylesheet" href="../css/responsive.css?v=20261124" />

  <script src="../js/theme.js?v=20261124"></script>
  <script src="../js/guard.js?v=20261124"></script>
</head>

<body data-page="recommendations">
  <div class="app">
    <div id="sidebar-root"></div>

    <div class="app__main">
      <div id="topbar-root"></div>

      <main class="app__content" id="main-content">
        <div class="page-width">
          <div class="page-head">
            <div>
              <p class="eyebrow"><i class="bi bi-lightbulb" aria-hidden="true"></i> Lộ trình cải thiện</p>
              <h2 class="page-head__title">Khuyến nghị bảo mật</h2>
              <p class="page-head__desc">Hành động cụ thể theo 5 trụ cột, sắp xếp theo mức độ ưu tiên dựa trên rủi ro của bạn.</p>
            </div>
            <div class="page-head__actions">
              <a class="btn btn-outline" href="report.html">
                <i class="bi bi-file-earmark-bar-graph" aria-hidden="true"></i> Xem báo cáo
              </a>
              <a class="btn btn-primary" href="assessment.html">
                <i class="bi bi-arrow-repeat" aria-hidden="true"></i> Đánh giá lại
              </a>
            </div>
          </div>

          <div class="grid grid--3 section-gap" id="recStats" data-animate></div>

          <div class="section-gap" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap">
            <div class="filter-bar" id="priorityFilter" role="group" aria-label="Lọc theo mức ưu tiên"></div>
            <label class="switch">
              <input type="checkbox" id="hideDone" />
              <span class="switch__track" aria-hidden="true"></span>
              <span>Ẩn khuyến nghị đã hoàn thành</span>
            </label>
          </div>

          <div class="section-gap" id="recommendationGroups" aria-live="polite"></div>

          <div class="panel section-gap" data-animate>
            <div class="panel__body" style="display: flex; gap: 12px; align-items: flex-start">
              <i class="bi bi-info-circle" style="color: var(--info); font-size: 1.05rem" aria-hidden="true"></i>
              <p class="text-sm text-muted" style="line-height: 1.6">
                Trạng thái hoàn thành được lưu trong tài khoản SDRSM của bạn và đồng bộ giữa các thiết bị.
              </p>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/animejs@3.2.2/lib/anime.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>

  <script src="../js/config.js?v=20261124"></script>
  <script src="../js/risk.js?v=20261124"></script>
  <script src="../js/api.js?v=20261124"></script>
  <script src="../js/data-service.js?v=20261124"></script>
  <script src="../js/layout.js?v=20261124"></script>
  <script src="../js/main.js?v=20261124"></script>
  <script src="../js/recommendations.js?v=20261124"></script>
</body>
</html>
